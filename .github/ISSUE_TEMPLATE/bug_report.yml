name: Bug report
description: Something renders wrong or fails
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the composition id (KlikTahuLong / KlikTahuShort) and frame number.
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command used
      placeholder: npm run render:short -- --frames=0-90
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
